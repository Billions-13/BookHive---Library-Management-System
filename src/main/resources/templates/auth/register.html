<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4 px-3">

<main id="main" class="card bh-auth-card p-4">
    <a th:href="@{/}" class="text-decoration-none">
        <h1 class="h3 text-center fw-bold text-warning mb-1">📚 BookHive</h1>
    </a>
    <h2 class="h5 text-center mb-4">Tạo tài khoản mới</h2>

    <!-- Duplicate e-mail / student code, or another business error from AuthService -->
    <div th:if="${error}" class="alert alert-warning border-warning text-center p-2 small mb-3"
         role="alert" id="accountExistsAlert">
        ⚠️ <strong th:text="${error}">Tài khoản đã tồn tại!</strong><br>
        Vui lòng dùng MSSV/Email khác hoặc <a th:href="@{/login}" class="fw-bold text-dark">đăng nhập ngay</a>.
    </div>

    <form th:action="@{/register}" th:object="${form}" method="post" id="registerForm">
        <div class="mb-3">
            <label class="form-label" for="fullName">Họ và tên</label>
            <input type="text" id="fullName" th:field="*{fullName}" class="form-control" th:errorclass="is-invalid"
                   placeholder="Nguyễn Văn A" autocomplete="name" maxlength="120" required>
            <div class="invalid-feedback" th:errors="*{fullName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="studentCode">Mã số sinh viên (MSSV)</label>
            <input type="text" id="studentCode" th:field="*{studentCode}" class="form-control"
                   th:errorclass="is-invalid" placeholder="VD: ITITIU22001" maxlength="30"
                   pattern="[A-Za-z0-9]{4,30}" data-pattern-message="MSSV chỉ gồm chữ và số, dài 4–30 ký tự."
                   aria-describedby="studentCodeHelp">
            <div id="studentCodeHelp" class="form-text">Giảng viên có thể để trống.</div>
            <div class="invalid-feedback" th:errors="*{studentCode}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid"
                   placeholder="student@hcmiu.edu.vn" autocomplete="email" maxlength="191" required>
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Mật khẩu</label>
            <input type="password" id="password" th:field="*{password}" class="form-control"
                   th:errorclass="is-invalid" placeholder="••••••••" autocomplete="new-password"
                   minlength="8" maxlength="72" required aria-describedby="passwordHelp">
            <div id="passwordHelp" class="form-text">Ít nhất 8 ký tự.</div>
            <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                   th:errorclass="is-invalid" placeholder="••••••••" autocomplete="new-password" required
                   data-match="password">
            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold mt-2">Đăng ký ngay</button>
    </form>

    <div class="text-center mt-3">
        <small>Đã có tài khoản? <a th:href="@{/login}" class="text-warning fw-bold">Đăng nhập</a></small>
    </div>
    <div class="text-center mt-2">
        <small><a th:href="@{/}" class="text-muted">← Về trang chủ</a></small>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
