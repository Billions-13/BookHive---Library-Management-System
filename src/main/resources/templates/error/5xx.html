<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hệ thống đang gặp sự cố')}"></head>
<body class="d-flex flex-column min-vh-100">
<a th:replace="~{fragments/layout :: skip-link}"></a>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<!-- Rendered by Spring Boot's error controller for HTTP status 5xx -->
<main id="main" class="container py-5 flex-grow-1">
    <div class="bh-card p-4 p-md-5 text-center mx-auto" style="max-width: 640px;">
        <div class="fs-1 mb-2" aria-hidden="true">🛠️</div>
        <p class="text-muted small mb-1" th:text="|Mã lỗi ${status}|">Mã lỗi 5xx</p>
        <h1 class="h4 fw-bold">Hệ thống đang gặp sự cố</h1>
        <p class="text-muted mb-4">Đã có lỗi phía máy chủ. Vui lòng thử lại sau ít phút; nếu vẫn lỗi, hãy báo cho thủ thư.</p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <button type="button" class="btn btn-warning fw-semibold" data-history-back>← Quay lại</button>
            <a class="btn btn-outline-dark" th:href="@{/}">Về trang chủ</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
