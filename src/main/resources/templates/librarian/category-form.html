<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${#strings.endsWith(formAction, '/new')} ? 'Thêm thể loại' : 'Sửa thể loại')}"></head>
<body class="d-flex flex-column min-vh-100">
<a th:replace="~{fragments/layout :: skip-link}"></a>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main id="main" class="container py-4 flex-grow-1" th:with="isNew=${#strings.endsWith(formAction, '/new')}">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
            <li class="breadcrumb-item"><a th:href="@{/librarian/categories}">Thể loại</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${isNew} ? 'Thêm mới' : 'Sửa'">Thêm mới</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="bh-page-header">
                <h1 th:text="${isNew} ? 'Thêm thể loại' : 'Sửa thể loại'">Thêm thể loại</h1>
            </div>
            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Lỗi</div>

            <form class="bh-card p-3 p-md-4" th:action="${formAction}" th:object="${form}" method="post" id="categoryForm">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="name">Tên thể loại <span class="text-danger">*</span></label>
                        <input class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid" maxlength="100" required>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="slug">Slug (đường dẫn) <span class="text-danger">*</span></label>
                        <input class="form-control" id="slug" th:field="*{slug}" th:errorclass="is-invalid" maxlength="120"
                               required pattern="[a-z0-9]+(-[a-z0-9]+)*" data-slug-from="#name" aria-describedby="slugHelp">
                        <div id="slugHelp" class="form-text">Chữ thường không dấu, nối bằng gạch ngang. Được tự điền khi bạn nhập tên thể loại.</div>
                        <div class="invalid-feedback" th:errors="*{slug}"></div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="targetAudience">Đối tượng độc giả</label>
                        <input class="form-control" id="targetAudience" th:field="*{targetAudience}" th:errorclass="is-invalid"
                               maxlength="80" placeholder="VD: Sinh viên, Giảng viên">
                        <div class="invalid-feedback" th:errors="*{targetAudience}"></div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="displayOrder">Thứ tự hiển thị</label>
                        <input class="form-control" type="number" id="displayOrder" th:field="*{displayOrder}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{displayOrder}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="description">Mô tả</label>
                        <textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2 mt-4">
                    <button class="btn btn-warning fw-semibold" type="submit">Lưu thể loại</button>
                    <a class="btn btn-outline-secondary" th:href="@{/librarian/categories}">Huỷ</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
