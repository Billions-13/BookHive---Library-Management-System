<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Change Password</title></head><body>
<h1>Change Password</h1><p th:if="${param.updated}">Password changed.</p><p th:if="${error}" th:text="${error}"></p>
<form th:action="@{/my/password}" th:object="${form}" method="post">
<p><label>Current password <input type="password" th:field="*{oldPassword}" required></label><span th:errors="*{oldPassword}"></span></p>
<p><label>New password (8+ characters) <input type="password" th:field="*{newPassword}" minlength="8" required></label><span th:errors="*{newPassword}"></span></p>
<button>Change</button></form></body></html>
