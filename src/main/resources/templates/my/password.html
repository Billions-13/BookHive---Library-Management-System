<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đổi mật khẩu')}"></head>
<body class="d-flex flex-column min-vh-100">
<a th:replace="~{fragments/layout :: skip-link}"></a>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main id="main" class="container py-4 flex-grow-1">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
            <li class="breadcrumb-item"><a th:href="@{/my/profile}">Hồ sơ cá nhân</a></li>
            <li class="breadcrumb-item active" aria-current="page">Đổi mật khẩu</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <ul class="nav nav-pills mb-3">
                <li class="nav-item"><a class="nav-link text-dark" th:href="@{/my/profile}">Hồ sơ</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/my/password}">Đổi mật khẩu</a></li>
            </ul>

            <div class="bh-card p-4">
                <h1 class="h4 fw-bold mb-3">Đổi mật khẩu</h1>

                <div th:if="${param.updated}" class="alert alert-success" role="status" data-autohide>
                    Đã đổi mật khẩu thành công.
                </div>
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Lỗi</div>

                <form th:action="@{/my/password}" th:object="${form}" method="post" id="passwordForm">
                    <div class="mb-3">
                        <label class="form-label" for="oldPassword">Mật khẩu hiện tại</label>
                        <input type="password" class="form-control" id="oldPassword" th:field="*{oldPassword}"
                               th:errorclass="is-invalid" autocomplete="current-password" required>
                        <div class="invalid-feedback" th:errors="*{oldPassword}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="newPassword">Mật khẩu mới</label>
                        <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}"
                               th:errorclass="is-invalid" autocomplete="new-password" minlength="8" maxlength="72"
                               required aria-describedby="newPasswordHelp">
                        <div id="newPasswordHelp" class="form-text">Ít nhất 8 ký tự.</div>
                        <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                    </div>
                    <div class="mb-3">
                        <!-- No name attribute: never sent to the server. /js/app.js compares it with newPassword. -->
                        <label class="form-label" for="confirmNewPassword">Nhập lại mật khẩu mới</label>
                        <input type="password" class="form-control" id="confirmNewPassword"
                               autocomplete="new-password" required data-match="newPassword">
                        <div class="invalid-feedback">Mật khẩu nhập lại không khớp</div>
                    </div>
                    <button class="btn btn-warning fw-semibold" type="submit">Đổi mật khẩu</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
