<!DOCTYPE html>
<!--
  Statistics page (advanced feature: Dashboard with Charts) – Member 3.
  Static file served at /librarian/dashboard.html; SecurityConfig already limits /librarian/** to
  librarians and admins. Numbers come from GET /api/stats through /js/dashboard.js.
-->
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thống kê thư viện - BookHive</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <style>
        .stat { background: #fff; border-radius: 14px; padding: 1rem 1.25rem; box-shadow: 0 4px 16px rgba(0, 0, 0, .05); height: 100%; }
        .stat-value { font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
        .chart-box { position: relative; height: 240px; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar bg-white shadow-sm mb-4" aria-label="Điều hướng">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="/">📚 BookHive</a>
        <a class="small" href="/librarian/loans">Quản lý phiếu mượn →</a>
    </div>
</nav>

<main class="container pb-5" id="dashboard">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 fw-bold mb-0">Thống kê thư viện</h1>
        <div class="d-flex align-items-center gap-2">
            <span class="small text-muted" id="updatedAt" aria-live="polite">Đang tải số liệu...</span>
            <button type="button" class="btn btn-sm btn-outline-dark" id="refreshButton">Làm mới</button>
        </div>
    </div>

    <div class="alert alert-danger d-none" role="alert" id="errorBox"></div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3"><div class="stat">
            <div class="small text-muted">Đầu sách đang phục vụ</div>
            <div class="stat-value" data-stat="totalTitles">…</div></div></div>
        <div class="col-6 col-lg-3"><div class="stat">
            <div class="small text-muted">Cuốn có thể mượn</div>
            <div class="stat-value" data-stat="availableCopies">…</div></div></div>
        <div class="col-6 col-lg-3"><div class="stat">
            <div class="small text-muted">Cuốn đang được mượn</div>
            <div class="stat-value" data-stat="borrowedCopies">…</div></div></div>
        <div class="col-6 col-lg-3"><div class="stat">
            <div class="small text-muted">Phiếu mượn quá hạn</div>
            <div class="stat-value" data-stat="overdueLoans">…</div></div></div>
    </div>

    <section class="stat" aria-labelledby="chartTitle">
        <h2 id="chartTitle" class="h6 fw-bold mb-1">Tình hình các cuốn sách đang phục vụ</h2>
        <p class="small text-muted mb-2">Số cuốn có thể mượn, đang mượn còn hạn và đang mượn quá hạn.</p>
        <div class="chart-box">
            <canvas id="circulationChart" role="img" aria-label="Biểu đồ tình hình mượn sách"></canvas>
        </div>
        <details class="mt-2">
            <summary class="small">Xem dạng bảng</summary>
            <table class="table table-sm small mt-2 mb-0" id="circulationTable"></table>
        </details>
    </section>
</main>

<script src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"
        integrity="sha384-Sse/HDqcypGpyTDpvZOJNnG0TT3feGQUkF9H+mnRvic+LjR+K1NhTt8f51KIQ3v3"
        crossorigin="anonymous"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
