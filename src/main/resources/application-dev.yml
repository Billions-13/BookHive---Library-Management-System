spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookhive_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:bookhive_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

app:
  mail:
    enabled: false