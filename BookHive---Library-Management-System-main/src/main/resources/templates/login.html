<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - BookHive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow border-0 p-4" style="width: 400px;">
        <h3 class="text-center fw-bold text-warning mb-2">📚 BookHive</h3>
        <h5 class="text-center mb-4">Đăng Nhập</h5>

        <!-- 1. THÔNG BÁO LỖI (Sẽ hiển thị khi đăng nhập sai) -->
        <!-- Sau này Spring Boot/Thymeleaf sẽ bật/tắt khung alert này -->
        <div class="alert alert-danger text-center p-2 small mb-3 d-none" id="errorMessage">
            Tên đăng nhập hoặc mật khẩu không chính xác!
        </div>

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label">Mã số sinh viên / Email</label>
                <input type="text" name="username" class="form-control" placeholder="Nhập MSSV hoặc Email..." required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold mt-2">Đăng nhập</button>
        </form>

        <!-- 2. NÚT CHUYỂN SANG TRANG ĐĂNG KÝ -->
        <div class="text-center mt-3">
            <small>Chưa có tài khoản? <a href="register.html" class="text-warning fw-bold">Đăng ký ngay</a></small>
        </div>
    </div>
</body>
</html>
