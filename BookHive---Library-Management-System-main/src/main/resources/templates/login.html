<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - BookHive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow border-0 p-4" style="width: 350px;">
        <h3 class="text-center fw-bold text-warning mb-4">📚 BookHive</h3>
        <h5 class="text-center mb-3">Đăng Nhập</h5>
        <form>
            <div class="mb-3">
                <label class="form-label">Mã số sinh viên / Email</label>
                <input type="text" class="form-control" placeholder="Nhập MSSV...">
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">Đăng nhập</button>
        </form>
        <div class="text-center mt-3">
            <small>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></small>
        </div>
    </div>
</body>
</html>
