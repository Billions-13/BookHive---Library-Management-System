<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHive - Thư Viện Trực Tuyến</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- File CSS riêng của Sasa -->
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="bg-light">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="#">📚 BookHive</a>
            <div class="d-flex gap-2">
                <input class="form-control form-control-sm" type="search" placeholder="Tìm tên sách...">
                <button class="btn btn-sm btn-outline-light">Tìm</button>
                <button class="btn btn-sm btn-warning">Đăng nhập</button>
            </div>
        </div>
    </nav>

    <!-- Banner -->
    <div class="bg-warning-subtle py-4 mb-4 text-center">
        <div class="container">
            <h1 class="fw-bold text-dark">Khám Phá Tri Thức Tại BookHive</h1>
            <p class="text-secondary mb-0">Hệ thống quản lý và mượn sách trực tuyến</p>
        </div>
    </div>

    <!-- Danh sách sách mẫu -->
    <div class="container my-4">
        <h3 class="fw-bold mb-3">Sách Nổi Bật</h3>
        <div class="row g-4">

            <!-- Card 1 -->
            <div class="col-md-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://via.placeholder.com/200x250" class="card-img-top" alt="Bìa sách">
                    <div class="card-body">
                        <span class="badge bg-primary mb-2">Công Nghệ</span>
                        <h5 class="card-title text-truncate">Lập trình Java Core</h5>
                        <p class="card-text text-muted small">Tác giả: Nguyễn Văn A</p>
                    </div>
                    <div class="card-footer bg-white border-0 d-flex justify-content-between align-items-center">
                        <span class="badge bg-success">Còn 5 cuốn</span>
                        <button class="btn btn-sm btn-outline-primary">Mượn ngay</button>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="col-md-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://via.placeholder.com/200x250" class="card-img-top" alt="Bìa sách">
                    <div class="card-body">
                        <span class="badge bg-info text-dark mb-2">CSDL</span>
                        <h5 class="card-title text-truncate">Thiết kế CSDL MySQL</h5>
                        <p class="card-text text-muted small">Tác giả: Trần Văn B</p>
                    </div>
                    <div class="card-footer bg-white border-0 d-flex justify-content-between align-items-center">
                        <span class="badge bg-danger">Đã hết</span>
                        <button class="btn btn-sm btn-secondary" disabled>Tạm hết</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
