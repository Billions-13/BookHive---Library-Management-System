<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - BookHive</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center my-5">
    <div class="card shadow border-0 p-4" style="width: 400px;">
        <h3 class="text-center fw-bold text-warning mb-2">📚 BookHive</h3>
        <h5 class="text-center mb-4">Tạo Tài Khoản Mới</h5>
        <form>
            <div class="mb-3">
                <label class="form-label">Họ và tên</label>
                <input type="text" class="form-control" placeholder="Nguyễn Văn A">
            </div>
            <div class="mb-3">
                <label class="form-label">Mã số sinh viên (MSSV)</label>
                <input type="text" class="form-control" placeholder="Nhập MSSV...">
            </div>
            <div class="mb-3">
                <label class="form-label">Email sinh viên</label>
                <input type="email" class="form-control" placeholder="student@hcmiu.edu.vn">
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" placeholder="••••••••">
            </div>
            <div class="mb-3">
                <label class="form-label">Xác nhận mật khẩu</label>
                <input type="password" class="form-control" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold mt-2">Đăng ký ngay</button>
        </form>
        <div class="text-center mt-3">
            <small>Đã có tài khoản? <a href="login.html">Đăng nhập</a></small>
        </div>
    </div>
</body>
</html>
