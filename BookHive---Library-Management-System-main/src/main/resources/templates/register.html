<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - BookHive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @keyframes blinkGlow {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                text-shadow: 0 0 12px #ffc107, 0 0 24px #ff9800;
            }
            50% {
                opacity: 0.45;
                transform: scale(1.06);
                text-shadow: 0 0 4px #ffc107;
            }
        }

        @keyframes spinSparkle {
            0% {
                transform: translate(-50%, -50%) rotate(0deg) scale(0.8);
            }
            50% {
                transform: translate(-50%, -50%) rotate(180deg) scale(1.15);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg) scale(0.8);
            }
        }

        @keyframes floatArrow {
            0%, 100% {
                transform: translateX(0);
            }
            50% {
                transform: translateX(8px);
            }
        }

        .blink-congrats {
            animation: blinkGlow 1.1s infinite ease-in-out;
        }

        .sparkle-sky-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 999;
            background: radial-gradient(circle at center, rgba(255, 193, 7, 0.14), rgba(0, 0, 0, 0.25));
        }

        .sparkle-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140vmax;
            height: 140vmax;
            animation: spinSparkle 7s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            letter-spacing: 2.2rem;
            text-align: center;
            line-height: 4.5rem;
            color: #ffe066;
            text-shadow: 0 0 10px #ffd43b, 0 0 22px #fab005;
        }

        .arrow-home {
            display: inline-block;
            animation: floatArrow 0.9s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4 position-relative">

    <!-- HIỆU ỨNG LẤP LÁNH RỢP TRỜI XOAY KHẮP MÀN HÌNH (Bỏ class d-none khi đăng ký thành công) -->
    <div class="sparkle-sky-overlay d-none" id="successSparkleOverlay">
        <div class="sparkle-spinner">
            ✦ ✧ ✨ ★ ✦ ✧ ✨ ★ ✦ ✧ ✨ ★
            ✧ ✨ ★ ✦ ✧ ✨ ★ ✦ ✧ ✨ ★ ✧
            ✨ ★ ✦ ✧ ✨ ★ ✦ ✧ ✨ ★ ✦ ✧
            ★ ✦ ✧ ✨ ★ ✦ ✧ ✨ ★ ✦ ✧ ✨
        </div>
    </div>

    <div class="card shadow border-0 p-4 position-relative" style="width: 420px; z-index: 1000;">
        <h3 class="text-center fw-bold text-warning mb-2">📚 BookHive</h3>
        <h5 class="text-center mb-4">Tạo Tài Khoản Mới</h5>

        <!-- TRẠNG THÁI 1: TÀI KHOẢN ĐÃ TỒN TẠI (Bỏ class d-none khi trùng tài khoản) -->
        <div class="alert alert-warning border-warning text-center p-2 small mb-3 d-none" id="accountExistsAlert">
            ⚠️ <strong>Tài khoản đã tồn tại!</strong> Vui lòng dùng MSSV/Email khác hoặc <a href="login.html" class="fw-bold text-dark">đăng nhập ngay</a>.
        </div>

        <!-- TRẠNG THÁI 2: ĐĂNG KÝ THÀNH CÔNG + MŨI TÊN TỚI THẲNG TRANG CHỦ (Bỏ class d-none khi thành công) -->
        <div class="alert alert-success border-success text-center p-3 mb-3 d-none" id="registerSuccessBox">
            <div class="fw-bold fs-5 text-success blink-congrats mb-2">
                ✨ Chúc mừng đăng ký thành công! ✨
            </div>
            <a href="index.html" class="btn btn-warning fw-bold w-100 mt-1">
                Về trang chủ <span class="arrow-home">➔</span>
            </a>
        </div>

        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label">Họ và tên</label>
                <input type="text" name="fullName" class="form-control" placeholder="Nguyễn Văn A" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mã số sinh viên (MSSV)</label>
                <input type="text" name="studentId" class="form-control" placeholder="Nhập MSSV..." required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email sinh viên</label>
                <input type="email" name="email" class="form-control" placeholder="student@hcmiu.edu.vn" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Xác nhận mật khẩu</label>
                <input type="password" name="confirmPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold mt-2">Đăng ký ngay</button>
        </form>

        <div class="text-center mt-3">
            <small>Đã có tài khoản? <a href="login.html" class="text-warning fw-bold">Đăng nhập</a></small>
        </div>
    </div>
</body>
</html>
